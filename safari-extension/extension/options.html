<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vibe Radar ayarları</title>
<style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;max-width:580px;margin:3rem auto;padding:0 1rem;color:#15202b}h1{font-size:1.45rem}label{display:block;margin:1.6rem 0 .5rem}input{box-sizing:border-box;width:100%;padding:.75rem;border:1px solid #8291a0;border-radius:8px;font:inherit}button{margin-top:1rem;padding:.7rem 1.1rem;border:0;border-radius:8px;background:#0f7ac6;color:white;font:inherit;cursor:pointer}p{line-height:1.5;color:#536471}#status{min-height:1.5rem}</style></head>
<body><h1>Vibe Radar X Taslakları</h1><p>Cloudflare üzerinde ayarladığınız SAFARI_EXTENSION_TOKEN değerini girin. Bu değer yalnız Safari extension depolamasında saklanır ve X sayfasına aktarılmaz.</p>
<form id="settings"><label for="token">Kişisel extension token</label><input id="token" type="password" autocomplete="off" spellcheck="false" minlength="32" required><button type="submit">Kaydet</button></form><p id="status" role="status"></p><script src="options.js"></script></body></html>
