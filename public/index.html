<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Heran Borsa</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">HB</div>
        <div class="brand-copy"><p>Piyasa akışı</p><h1>Heran Borsa</h1></div>
        <div class="live-status" aria-label="Canlı akış"><i></i><span id="clock">--:--</span></div>
      </header>

      <section id="search-panel" class="search-panel" hidden aria-label="Akışta ara">
        <label class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.4A7.75 7.75 0 1 1 3.5 11.25a7.75 7.75 0 0 1 15.5 0Z" /></svg>
          <input id="query" maxlength="120" placeholder="Haber, şirket veya konu ara" autocomplete="off" />
        </label>
        <div class="filter-row">
          <label><span>Hisse</span><input id="ticker" maxlength="10" placeholder="THYAO" autocomplete="off" /></label>
          <label><span>Kaynak</span><select id="source" aria-label="Kaynak filtresi"><option value="">Tüm kaynaklar</option></select></label>
          <button id="clear-filters" type="button">Temizle</button>
        </div>
      </section>

      <div class="stream-head">
        <p id="section-title">Tüm gelişmeler</p>
        <p id="status" role="status" aria-live="polite"><i></i><span>Akış yükleniyor</span></p>
      </div>
      <section id="feed" class="feed" aria-live="polite"></section>
      <button id="more" class="load-more" hidden>Daha eski kayıtları göster</button>
    </main>

    <nav class="bottom-nav" aria-label="Akış bölümleri">
      <button class="nav-active" data-type="" aria-label="Tüm akış"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H5V10.5Z" /></svg><small>Akış</small></button>
      <button data-type="kap" aria-label="KAP bildirimleri"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5" /></svg><small>KAP</small></button>
      <button data-type="spk" aria-label="SPK bültenleri"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6zM9 10h6M9 14h6M9 18h4" /></svg><small>SPK</small></button>
      <button data-type="news" aria-label="Haberler"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM7 8h4v4H7zM13 8h4M13 11h4M7 15h10" /></svg><small>Haber</small></button>
      <button id="search-button" aria-label="Ara ve filtrele" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.4A7.75 7.75 0 1 1 3.5 11.25a7.75 7.75 0 0 1 15.5 0Z" /></svg><small>Ara</small></button>
    </nav>

    <template id="item-template">
      <article class="feed-item">
        <a class="item-open" target="_blank" rel="noopener noreferrer">
          <span class="source-icon" aria-hidden="true"></span>
          <span class="item-content">
            <span class="item-meta"><strong class="badge"></strong><time></time></span>
            <span class="item-title"></span>
            <span class="item-summary"></span>
            <span class="tickers"></span>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
        </a>
        <div class="item-footer"><button class="tweet" type="button"><span>✦</span> Tweet oluştur</button></div>
      </article>
    </template>

    <dialog id="reader-dialog" aria-labelledby="reader-title">
      <header class="reader-toolbar"><button id="reader-close" type="button" aria-label="Akışa dön">‹ <span>Geri</span></button><span id="reader-kind">Haber</span><a id="reader-source" target="_blank" rel="noopener noreferrer">Kaynağa git ↗</a></header>
      <div class="reader-scroll" tabindex="0">
        <article class="reader-article">
          <p id="reader-meta" class="reader-meta"></p>
          <h2 id="reader-title"></h2>
          <p id="reader-symbols" class="tickers"></p>
          <p id="reader-status" role="status" aria-live="polite">İçerik yükleniyor…</p>
          <div id="reader-body" class="reader-body"></div>
          <section id="reader-attachments" hidden><h3>Ek dosyalar</h3><p>Ekler kaynak üzerinden açılır.</p><div id="reader-files"></div></section>
          <p id="reader-notice" class="reader-notice" hidden></p>
          <button id="reader-retry" type="button" hidden>Tekrar dene</button>
        </article>
      </div>
    </dialog>

    <dialog id="tweet-dialog">
      <form method="dialog" class="tweet-sheet">
        <div class="sheet-handle" aria-hidden="true"></div>
        <header class="tweet-sheet-head">
          <div><small>AI TASLAĞI</small><strong>Paylaşıma hazır tweet</strong></div>
          <button class="close-sheet" value="close" aria-label="Kapat">×</button>
        </header>
        <div id="tweet-progress" class="tweet-progress" hidden><i></i><span>Kaynak ve ekler okunuyor…</span></div>
        <p id="tweet-message" class="tweet-message" hidden></p>
        <textarea id="tweet-draft" readonly hidden aria-label="Oluşturulan tweet"></textarea>
        <div class="tweet-sheet-actions">
          <button id="copy-tweet" type="button" disabled>Tweeti kopyala</button>
          <button value="close" class="secondary-action">Kapat</button>
        </div>
        <p class="review-note">Yayımlamadan önce rakamları ve isimleri kaynakla karşılaştır.</p>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
