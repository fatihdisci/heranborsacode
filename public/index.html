<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080b10" /><meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
  <title>AI akışı</title><link rel="stylesheet" href="/styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body class="auth-pending">
  <section id="access-screen" class="access-screen"><div><span>✦</span><h1>Özel uygulama</h1><p>Bu ekran yetkili Telegram oturumundan açılır.</p></div></section>
  <main class="app-shell">
    <header class="app-header"><div class="brand-mark">✦</div><div><p id="subtitle">AI akışı</p><h1 id="brand">AI akışı</h1></div><time id="clock"></time></header>
    <section class="toolbar"><button id="search-button" type="button" aria-expanded="false">⌕ &nbsp; Ara ve filtrele</button><span id="status" role="status">Akış yükleniyor</span></section>
    <section id="search-panel" class="search-panel" hidden><input id="query" maxlength="120" placeholder="Konu veya metin ara" /><select id="source" aria-label="Kaynak seç"><option value="">Tüm kaynaklar</option></select><button id="clear-filters" type="button">Temizle</button></section>
    <h2 id="section-title">Tüm gelişmeler</h2><section id="feed" class="feed" aria-live="polite"></section><button id="more" class="load-more" hidden>Daha eski kayıtlar</button>
  </main>
  <nav class="bottom-nav" aria-label="Kategoriler"><button class="nav-active" data-category="">Akış</button><button data-category="openai">OpenAI</button><button data-category="claude">Claude</button><button data-category="coding">Coding</button><button data-category="resets">Resetler</button></nav>
  <template id="item-template"><article class="feed-item"><button class="item-open" type="button"><span class="item-meta"><strong class="badge"></strong><time></time></span><strong class="item-title"></strong><span class="item-summary"></span></button><div class="item-actions"><a class="source-link" target="_blank" rel="noopener noreferrer">Kaynağı aç ↗</a><button class="tweet" type="button">Tweet oluştur</button></div><p class="attribution" hidden></p></article></template>
  <dialog id="reader-dialog"><header class="dialog-head"><button id="reader-close" type="button">← Akış</button><span id="reader-kind"></span><a id="reader-source" target="_blank" rel="noopener noreferrer">Kaynağa git ↗</a></header><div class="reader-scroll"><p id="reader-meta"></p><h2 id="reader-title"></h2><p id="reader-status"></p><div id="reader-body"></div><p id="reader-notice"></p><button id="reader-retry" type="button" hidden>Tekrar dene</button><p id="reader-attribution" hidden></p></div></dialog>
  <dialog id="tweet-dialog"><div class="tweet-sheet"><header class="dialog-head"><strong>Tweet taslağı</strong><button id="tweet-close" type="button">✕</button></header><p class="hint">Kaynak ve kendi notunla taslak oluştur. X'e otomatik gönderilmez.</p><label>Benim notum (opsiyonel)<textarea id="tweet-note" maxlength="500" placeholder="Varsa kendi görüşünü veya deneyimini yaz"></textarea></label><div class="options"><label>Ton<select id="tweet-tone"><option value="natural">Doğal</option><option value="news">Haber</option><option value="commentary">Yorumlu</option></select></label></div><button id="generate-tweet" class="primary" type="button">Taslak oluştur</button><p id="tweet-progress" hidden>Kaynak okunuyor ve taslak hazırlanıyor…</p><p id="tweet-message" role="status" hidden></p><textarea id="tweet-draft" readonly hidden aria-label="Oluşturulan tweet"></textarea><button id="copy-tweet" type="button" disabled>Tweeti kopyala</button></div></dialog>
  <script type="module" src="/app.js"></script>
</body></html>
