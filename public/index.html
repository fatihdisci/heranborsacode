<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b12" />
    <title>Heran Borsa</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main>
      <header class="topbar"><div class="brand-mark">HB</div><div><p class="eyebrow">CANLI PİYASA AKIŞI</p><h1>Heran Borsa</h1></div><div class="live"><i></i><span id="clock">--:--</span></div></header>
      <section class="controls" aria-label="Akış filtreleri">
        <div class="tabs" role="tablist"><button class="active" data-type="">Tümü</button><button data-type="kap">KAP</button><button data-type="spk">SPK</button><button data-type="news">Haberler</button></div>
        <details class="filters"><summary>⌕ Ara ve filtrele</summary><div class="searches"><input id="ticker" maxlength="10" placeholder="Ticker: THYAO" autocomplete="off" /><input id="query" maxlength="120" placeholder="Başlıkta ara" autocomplete="off" /></div><select id="source" aria-label="Kaynak filtresi"><option value="">Tüm kaynaklar</option></select></details>
      </section>
      <p id="status" role="status">Akış yükleniyor…</p><section id="feed" aria-live="polite"></section><button id="more" hidden>Daha fazla yükle</button>
    </main>
    <nav class="bottom-nav" aria-label="Hızlı filtreler"><button class="nav-active" data-type="">⌂<small>Akış</small></button><button data-type="kap">▣<small>KAP</small></button><button data-type="spk">▤<small>SPK</small></button><button data-type="news">◉<small>Haber</small></button><button id="search-button">⌕<small>Ara</small></button></nav>
    <template id="item-template"><article class="item"><a class="item-open" target="_blank" rel="noopener noreferrer"><span class="source-icon"></span><div class="item-copy"><div class="meta"><span class="badge"></span><time></time></div><h2></h2><p class="tickers"></p></div><span class="chevron">›</span></a><div class="item-actions"><button class="copy">Kopyala</button><button class="tweet">Tweeti Kopyala</button></div></article></template>
    <script type="module" src="/app.js"></script>
  </body>
</html>
