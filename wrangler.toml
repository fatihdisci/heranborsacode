name = "heranborsa"
main = "src/index.ts"
compatibility_date = "2026-09-20"
workers_dev = true

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "heranborsa-db"
database_id = "2127440b-97f6-4d54-b9b8-2bc0a461130a"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "COMMAND_MEDIA"
bucket_name = "heranborsa-command-media"

[[durable_objects.bindings]]
name = "POLL_SHARDS"
class_name = "PollShard"

[[migrations]]
tag = "poll-shards-v1"
new_sqlite_classes = [ "PollShard" ]

[[durable_objects.bindings]]
name = "TELEGRAM_ACTIONS"
class_name = "TelegramActions"

[[migrations]]
tag = "telegram-actions-v1"
new_sqlite_classes = [ "TelegramActions" ]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true
head_sampling_rate = 1

[vars]
PUBLIC_BASE_URL = "https://borsa.discilaw.com"
# This is not a secret. Set it only after confirming the MKK endpoint contract.
MKK_API_BASE_URL = "https://apigwdev.mkk.com.tr/api/vyk"

# Cloudflare cron supervises independent AI source and Telegram shards each minute.
[triggers]
crons = ["* * * * *"]
